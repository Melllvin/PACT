name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/
          if-no-files-found: ignore

  # Constitution III: coverage must not decrease from one PR to the next. Coverage differs per
  # platform (OS-specific branches), so the comparison is made on a single OS against the base.
  coverage-guard:
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .coverage-base
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: coverage-macos-latest
          path: coverage
      - name: Measure base coverage
        id: base
        working-directory: .coverage-base
        run: |
          if [ ! -f package.json ] || ! grep -q '"coverage"' package.json; then
            echo "Base has no coverage script: nothing to compare." && exit 0
          fi
          npm ci
          npx vitest run --coverage --coverage.reporter=json-summary --coverage.reportOnFailure || true
          test -f coverage/coverage-summary.json && echo "measured=true" >> "$GITHUB_OUTPUT"
      - name: Compare with pull request coverage
        if: steps.base.outputs.measured == 'true'
        run: >-
          node --no-warnings --experimental-strip-types scripts/coverage-guard.ts
          .coverage-base/coverage/coverage-summary.json "$GITHUB_WORKSPACE/.coverage-base"
          coverage/coverage-summary.json "$GITHUB_WORKSPACE"

  e2e:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      # T125 (plan R12, R14): the same smoke on the packaged app, node-pty loaded from outside asar.
      - name: Package the app (unpacked)
        run: npx electron-builder --dir --${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }} --publish never
      - name: e2e smoke on the packaged app
        run: npx playwright test tests/e2e/smoke.spec.ts tests/e2e/us2-quick-launch.spec.ts
        env:
          PACT_E2E_PACKAGED: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
      # Layout captures at 1024 px and on a large screen, kept for review (T157).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: layout-${{ matrix.os }}
          path: test-results/layout/
          if-no-files-found: ignore
