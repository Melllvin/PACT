# Commentaires et ordre libres : rien ne doit bouger
ends: [ pr ]   # une seule arrivée
start: spec
transitions:
  # la boucle
  - from: spec
    to: test
    on: [ready]
  - from: test
    to: dev
    on:
      - tests-written
      - defects
    maxRounds: 3 # trois tours

  - { from: dev, to: test, on: [done] }
  - { from: test, to: pr, on: [accepted] }
stages:
  - id: spec
    type: spec
    agents: [spec]
    instruction: 'Cadre l''issue.'
  - { id: test, type: test, agents: [tester] }
  - { id: dev,  type: dev,  agents: [dev] }
  - { id: pr, type: pr }
agents:
  dev: { role: dev, model: claude-sonnet-5-5 } # modèle libre
  tester: { role: test }
  spec: { role: spec }
name: "libre"
version: 1
