# Le recap est l'arrivée
version: 1
name: livraison
agents:
  spec: { role: spec }
  tester: { role: test }
  dev: { role: dev }
  scribe: { role: recap, model: claude-haiku-5-5 }
stages:
  - { id: spec, type: spec, agents: [spec] }
  - { id: test, type: test, agents: [tester] }
  - { id: dev, type: dev, agents: [dev] }
  - { id: polish, type: polish, agents: [dev, tester], passes: 0 }
  - { id: pr, type: pr, mergeMode: merge }
  - { id: recap, type: recap, agents: [scribe], instruction: "Résume la livraison." }
transitions:
  - { from: spec, to: test, on: [ready] }
  - { from: test, to: dev, on: [tests-written, defects], maxRounds: 3 }
  - { from: dev, to: test, on: [done] }
  - { from: test, to: polish, on: [accepted] }
  - { from: polish, to: pr, on: [done] }
  - { from: pr, to: dev, on: [ci-red, tests-failed, conflicted, user-refused], maxRounds: 3 }
  - { from: pr, to: recap, on: [merged] }
start: spec
ends: [recap]
